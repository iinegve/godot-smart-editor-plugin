name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v. Leave empty to use the next patch version."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$(python3 <<'PY'
          import os
          import re
          import subprocess

          requested_version = os.environ.get("VERSION_INPUT", "").strip()
          if requested_version.startswith("v"):
              requested_version = requested_version[1:]

          if requested_version:
              if not re.fullmatch(r'\d+\.\d+\.\d+', requested_version):
                  raise SystemExit("Version must use X.Y.Z format, for example 0.3.0.")

              tag_name = f"v{requested_version}"
              tag_exists = subprocess.run(
                  ["git", "rev-parse", "--quiet", "--verify", f"refs/tags/{tag_name}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if tag_exists:
                  raise SystemExit(f"Release tag {tag_name} already exists.")

              print(requested_version)
              raise SystemExit

          versions = []
          tags = subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*"],
              text=True,
          ).splitlines()
          for tag in tags:
              tag_match = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)', tag)
              if tag_match:
                  versions.append(tuple(int(part) for part in tag_match.groups()))

          if not versions:
              raise SystemExit("No vX.Y.Z release tags found. Create and push a seed tag first.")

          major, minor, patch = max(versions)
          next_version = f"{major}.{minor}.{patch + 1}"
          print(next_version)
          PY
          )"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Package addon
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PACKAGE_DIR="$RUNNER_TEMP/smart-editor-plugin-package"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/addons"
          rsync -a --exclude='media/' addons/smart-editor-plugin "$PACKAGE_DIR/addons/"
          cp README.md "$PACKAGE_DIR/addons/smart-editor-plugin/README.md"
          cp SHORTCUTS.md "$PACKAGE_DIR/addons/smart-editor-plugin/SHORTCUTS.md"
          cp SETTINGS.md "$PACKAGE_DIR/addons/smart-editor-plugin/SETTINGS.md"

          PACKAGE_DIR="$PACKAGE_DIR" python3 <<'PY'
          import os
          import re
          from pathlib import Path

          plugin_cfg = Path(os.environ["PACKAGE_DIR"]) / "addons/smart-editor-plugin/plugin.cfg"
          text = plugin_cfg.read_text()
          text, replacement_count = re.subn(
              r'^version="[^"]*"$',
              f'version="{os.environ["VERSION"]}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if replacement_count != 1:
              raise SystemExit("Could not inject version into packaged plugin.cfg.")
          plugin_cfg.write_text(text)
          PY

          (
            cd "$PACKAGE_DIR"
            zip -qr "$GITHUB_WORKSPACE/smart-editor-plugin-${TAG}.zip" addons
          )

      - name: Create release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -a "$TAG" "$GITHUB_SHA" -m "Smart Editor ${TAG}"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "smart-editor-plugin-${TAG}.zip" \
            --title "$TAG" \
            --notes "Smart Editor ${TAG}" \
            --target "$GITHUB_SHA"
